<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flagi Świata</title>
<meta name="description" content="Gra dla dzieci: flagi, kraje, stolice i języki świata.">
<meta name="theme-color" content="#1F6FB8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
html{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;-webkit-tap-highlight-color:transparent}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: one centred play column like a school atlas page; big tap targets, flag is always the hero */
:root{
  --bg:#EAF4FB; --paper:#FFFFFF; --ink:#13324B; --muted:#56728A; --line:#C9DDEC;
  --sea:#1F6FB8; --sun:#FFC83D; --sun-ink:#5A3D00; --good:#1E9E5A; --good-bg:#DDF5E7; --bad:#D9432F; --bad-bg:#FCE3DE;
  --shadow:0 3px 0 #BCD3E6;
  --display:"Fredoka","Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1D2B; --paper:#16293B; --ink:#E8F1F8; --muted:#9DB5C9; --line:#2A4560;
  --sea:#5AA9EE; --sun:#FFC83D; --sun-ink:#3A2700; --good:#4FD08A; --good-bg:#153A2A; --bad:#FF7A66; --bad-bg:#43211C;
  --shadow:0 3px 0 #08131D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1D2B; --paper:#16293B; --ink:#E8F1F8; --muted:#9DB5C9; --line:#2A4560;
  --sea:#5AA9EE; --sun:#FFC83D; --sun-ink:#3A2700; --good:#4FD08A; --good-bg:#153A2A; --bad:#FF7A66; --bad-bg:#43211C;
  --shadow:0 3px 0 #08131D; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 32px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.15}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--sea);outline-offset:3px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:36px}
.brand h1{font-size:30px;font-weight:700;color:var(--ink)}
.brand h1 span{color:var(--sea)}
.pole{width:10px;height:44px;border-radius:5px;background:var(--muted);position:relative}
.pole::after{content:"";position:absolute;left:10px;top:2px;width:30px;height:20px;border-radius:2px 6px 6px 2px;
  background:linear-gradient(var(--paper) 50%,var(--bad) 50%);box-shadow:inset 0 0 0 1.5px var(--line);animation:wave 2.4s ease-in-out infinite;transform-origin:left center}
@keyframes wave{50%{transform:skewY(-6deg) scaleX(.94)}}
.stars{display:flex;align-items:center;gap:6px;background:var(--sun);color:var(--sun-ink);font-family:var(--display);font-weight:600;
  padding:6px 14px;border-radius:999px;font-variant-numeric:tabular-nums}
.ghost{background:transparent;border:2px solid var(--line);border-radius:12px;padding:6px 12px;font-weight:700;color:var(--muted)}
.ghost:hover{border-color:var(--sea);color:var(--sea)}

/* home */
.hello{font-size:19px;color:var(--muted);margin:0}
.lvl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lvl .lab{font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.seg{border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 16px;font-weight:800}
.seg[aria-pressed="true"]{background:var(--sea);border-color:var(--sea);color:#fff}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.mode{display:flex;flex-direction:column;gap:10px;align-items:flex-start;text-align:left;background:var(--paper);border:2px solid var(--line);
  border-radius:20px;padding:16px;box-shadow:var(--shadow);transition:transform .12s}
.mode:hover{transform:translateY(-2px);border-color:var(--sea)}
.mode:active{transform:translateY(1px)}
.mode h3{font-size:21px;font-weight:600}
.mode p{margin:0;color:var(--muted);font-size:15px}
.mode .best{font-size:13px;font-weight:800;color:var(--sea)}
.pic{display:flex;align-items:center;gap:8px;height:48px}
.pic img{height:40px;width:auto;border-radius:4px;box-shadow:0 0 0 1px var(--line)}
.pic .arrow{font-family:var(--display);font-size:22px;color:var(--muted)}
.pic .word{font-family:var(--display);font-weight:600;font-size:16px;background:var(--bg);padding:4px 10px;border-radius:10px}
.atlasbtn{align-self:flex-start}

/* game */
.bar{display:flex;align-items:center;gap:12px}
.dots{display:flex;gap:6px;flex:1;flex-wrap:wrap}
.dot{width:22px;height:10px;border-radius:5px;background:var(--line)}
.dot.ok{background:var(--good)} .dot.no{background:var(--bad)} .dot.now{background:var(--sun)}
.streak{font-family:var(--display);font-weight:600;color:var(--bad);min-width:3em;text-align:right}
.card{background:var(--paper);border:2px solid var(--line);border-radius:24px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:16px;box-shadow:var(--shadow)}
.q{font-family:var(--display);font-size:22px;font-weight:600;text-align:center;display:flex;align-items:center;gap:10px;justify-content:center;flex-wrap:wrap}
.say{border:none;background:var(--bg);border-radius:50%;width:40px;height:40px;display:inline-grid;place-items:center;flex:none}
.say svg{width:22px;height:22px;fill:var(--sea)}
.bigflag{width:min(100%,340px);aspect-ratio:4/3;object-fit:cover;border-radius:10px;box-shadow:0 0 0 2px var(--line),0 8px 20px rgba(19,50,75,.15)}
.fresh .bigflag,.fresh .country{animation:pop .35s ease-out}
.country{font-family:var(--display);font-weight:700;font-size:clamp(28px,7vw,44px);text-align:center;color:var(--sea)}
.minirow{display:flex;align-items:center;gap:10px}
.minirow img{height:44px;border-radius:5px;box-shadow:0 0 0 1px var(--line)}
@keyframes pop{from{transform:scale(.85);opacity:.4}to{transform:none;opacity:1}}
.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:100%}
.ans{min-height:64px;background:var(--bg);border:2px solid var(--line);border-radius:16px;padding:10px;font-weight:800;font-size:18px;line-height:1.2;
  display:flex;align-items:center;justify-content:center;text-align:center;box-shadow:var(--shadow);transition:transform .1s}
.ans:hover:not(:disabled){border-color:var(--sea);transform:translateY(-2px)}
.ans:disabled{cursor:default}
.ans.flagans{padding:8px;background:var(--paper)}
.ans.flagans img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;box-shadow:0 0 0 1px var(--line)}
.ans.right{background:var(--good-bg);border-color:var(--good);animation:bounce .4s}
.ans.wrong{background:var(--bad-bg);border-color:var(--bad);animation:shake .35s}
.ans.dim{opacity:.45}
@keyframes bounce{40%{transform:scale(1.06)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{width:100%;border-radius:16px;padding:14px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.fb.good{background:var(--good-bg)} .fb.bad{background:var(--bad-bg)}
.fb .big{font-family:var(--display);font-size:22px;font-weight:700}
.fb.good .big{color:var(--good)} .fb.bad .big{color:var(--bad)}
.fb .facts{flex:1;min-width:0;font-size:15px}
.fb .facts b{font-weight:800}
.fb img{height:54px;border-radius:5px;box-shadow:0 0 0 1px var(--line)}
.next{background:var(--sun);color:var(--sun-ink);border:none;border-radius:16px;padding:14px 26px;font-family:var(--display);font-weight:600;font-size:20px;box-shadow:0 3px 0 #C99500}
.next:hover{filter:brightness(1.05)}

/* end */
.end{text-align:center}
.trophy{display:flex;gap:6px;justify-content:center}
.trophy svg{width:64px;height:64px}
.trophy .on{fill:var(--sun);animation:pop .5s backwards}
.trophy .off{fill:var(--line)}
.score{font-family:var(--display);font-size:52px;font-weight:700;color:var(--sea);font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.missed{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.missed figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px;width:110px;font-size:13px;font-weight:700}
.missed img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:5px;box-shadow:0 0 0 1px var(--line)}

/* atlas */
.filters{display:flex;gap:8px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.tile{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:6px;text-align:left}
.tile img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;box-shadow:0 0 0 1px var(--line)}
.tile b{font-size:15px;line-height:1.2}
.tile small{color:var(--muted);font-size:13px;line-height:1.3}
.tile:hover{border-color:var(--sea)}
/* nuty */
.staff{display:block;color:var(--ink);overflow:visible}
.staff .ln{stroke:currentColor;stroke-width:1.1}
.staff .hd{fill:currentColor}
.staff .st{stroke:currentColor;stroke-width:1.4}
.staff.big{width:min(100%,360px);height:auto;background:var(--paper);border-radius:12px;animation:none}
.fresh .staff.big,.fresh .notename{animation:pop .35s ease-out}
.ans.staffans{padding:6px;background:var(--paper)}
.ans.staffans .staff{width:100%;height:auto}
.notename{font-family:var(--display);font-weight:700;font-size:clamp(40px,11vw,64px);line-height:1;color:var(--sea);text-align:center}
.notename small{display:block;font-size:20px;color:var(--muted);font-weight:600;margin-top:6px}
.ans .sol{display:block;font-size:13px;font-weight:700;color:var(--muted)}
.pic .staff{height:44px;width:auto}
.fb .staff{height:58px;width:auto;background:var(--paper);border-radius:6px}
.missed .staff{width:100%;height:auto;background:var(--paper);border-radius:5px;box-shadow:0 0 0 1px var(--line)}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}

@media (max-width:480px){
  .modes{grid-template-columns:minmax(0,1fr)}
  .ans{font-size:16px;min-height:58px}
  .brand h1{font-size:22px}
  .top{flex-wrap:nowrap}
  .stars{padding:6px 10px}
  .fb .facts{flex-basis:100%}
  .fb .next{width:100%}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>

const shuffle = a => {a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pick = a => a[Math.random()*a.length|0];
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pool = () => S.level==="easy" ? ALL.filter(c=>c.easy) : ALL;

const STAR = cls => `<svg viewBox="0 0 24 24" class="${cls}"><path d="M12 2l3 6.6 7.2.8-5.4 4.9 1.5 7.1L12 17.8 5.7 21.4l1.5-7.1L1.8 9.4 9 8.6z"/></svg>`;

function say(t){try{const s=window.speechSynthesis;if(!s)return;s.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="pl-PL";u.rate=.9;
  const v=s.getVoices().find(v=>v.lang&&v.lang.toLowerCase().startsWith("pl"));if(v)u.voice=v;s.speak(u)}catch(e){}}

/* ---------- nuty ---------- */
// Pozycja p na pięciolinii: 0 = dolna linia, 1 = pierwsze pole, 2 = druga linia ... 8 = górna linia.
// Ujemne i powyżej 8 to nuty pod i nad pięciolinią (z liniami dodanymi).

const SOLF = {C:"do",D:"re",E:"mi",F:"fa",G:"sol",A:"la",H:"si"};

  bass:  {name:"klucz basowy",    base:18, range:[-2,10], easy:[-2,10],  // dolna linia = G (G wielkie)
    path:"M50 123Q216 231 288 301Q336 348 373.0 408.5Q410 469 431.5 536.0Q453 603 453 669Q453 728 435.0 773.5Q417 819 383.0 845.0Q349 871 302 871Q284 871 264.5 867.0Q245 863 224 855Q181 839 158.0 813.5Q135 788 135 765Q135 756 143.0 752.0Q151 748 158 748Q168 748 183 752Q190 754 196.5 755.0Q203 756 210 756Q248 756 272.0 733.5Q296 711 296 674Q296 638 266.0 612.0Q236 586 195 586Q146 586 111.0 617.0Q76 648 76 697Q76 756 109.0 802.0Q142 848 198.5 874.0Q255 900 324 900Q400 900 460.0 867.0Q520 834 555.5 776.5Q591 719 591 646Q591 551 538 464Q511 419 476.5 379.0Q442 339 389.0 297.5Q336 256 256.0 208.0Q176 160 57 101ZM687.0 809.0Q710 809 726.0 793.0Q742 777 742.0 754.0Q742 731 726.0 715.5Q710 700 687.0 700.0Q664 700 648.0 715.5Q632 731 632.0 754.0Q632 777 648.0 793.0Q664 809 687.0 809.0ZM687.0 589.0Q710 589 726.0 573.0Q742 557 742.0 534.0Q742 511 726.0 495.5Q710 480 687.0 480.0Q664 480 648.0 495.5Q632 511 632.0 534.0Q632 557 648.0 573.0Q664 589 687.0 589.0Z"}
};
const noteLetter = (clef,p) => LETTERS[(CLEFS[clef].base+p)%7];
function noteFreq(clef,p){
  const abs=CLEFS[clef].base+p, oct=Math.floor(abs/7), midi=12*(oct+1)+[0,2,4,5,7,9,11][abs%7];
  return 440*Math.pow(2,(midi-69)/12);
}
function placeText(p){
  if(p===-2) return "na linii dodanej pod pięciolinią";
  if(p===-1) return "tuż pod pięciolinią";
  if(p===9)  return "tuż nad pięciolinią";
  if(p===10) return "na linii dodanej nad pięciolinią";
  return p%2===0 ? `na ${p/2+1}. linii` : `w ${(p+1)/2}. polu`;
}
function staffSVG(clef,p,cls=""){
  const y=v=>60-v*5, x=108;
  let s=`<svg class="staff ${cls}" viewBox="0 0 160 84" role="img" aria-label="Pięciolinia, ${CLEFS[clef].name}">`;
  for(let i=0;i<5;i++) s+=`<line class="ln" x1="2" x2="158" y1="${y(i*2)}" y2="${y(i*2)}"/>`;
  s+=`<path class="hd" transform="translate(${clef==="treble"?8:10},60) scale(.04,-.04)" d="${CLEFS[clef].path}"/>`;
  if(p!=null){
    for(let l=-2;l>=p;l-=2) s+=`<line class="ln" x1="${x-11}" x2="${x+11}" y1="${y(l)}" y2="${y(l)}"/>`;
    for(let l=10;l<=p;l+=2) s+=`<line class="ln" x1="${x-11}" x2="${x+11}" y1="${y(l)}" y2="${y(l)}"/>`;
    const up=p<4, sx=up?x+5.6:x-5.6;
    s+=`<line class="st" x1="${sx}" x2="${sx}" y1="${y(p)}" y2="${y(p)+(up?-33:33)}"/>`;
    s+=`<ellipse class="hd" cx="${x}" cy="${y(p)}" rx="6.4" ry="4.6" transform="rotate(-20 ${x} ${y(p)})"/>`;
  }
  return s+"</svg>";
}
let audio=null;
function playNote(f){try{
  audio=audio||new (window.AudioContext||window.webkitAudioContext)();
  const t=audio.currentTime, o=audio.createOscillator(), o2=audio.createOscillator(), g=audio.createGain();
  o.type="triangle"; o.frequency.value=f; o2.type="sine"; o2.frequency.value=f*2;
  const g2=audio.createGain(); g2.gain.value=.25; o2.connect(g2); g2.connect(g);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.35,t+.02); g.gain.exponentialRampToValueAtTime(.001,t+1.4);
  o.connect(g); g.connect(audio.destination); o.start(t); o2.start(t); o.stop(t+1.5); o2.stop(t+1.5);
}catch(e){}}
function makeNoteQuestion(used){
  let clef,p,key,tries=0;
  do{
    clef = S.level==="easy" ? "treble" : pick(["treble","bass"]);
    const [a,b] = S.level==="easy" ? CLEFS[clef].easy : CLEFS[clef].range;
    p = a + (Math.random()*(b-a+1)|0); key=clef+p;
  }while(used.has(key) && ++tries<50);
  used.add(key);
  const letter = noteLetter(clef,p), n={clef,p,letter};
  if(Math.random()<.5){
    const wrong = shuffle(LETTERS.filter(l=>l!==letter)).slice(0,3);
    return {mode:"note",sub:"name",n,options:shuffle([letter,...wrong]).map(l=>({label:l,ok:l===letter}))};
  }
  const [a,b] = S.level==="easy" ? CLEFS[clef].easy : CLEFS[clef].range, seen=new Set([letter]), opts=[{p,ok:true}];
  for(const q of shuffle(Array.from({length:b-a+1},(_,i)=>a+i))){
    const l=noteLetter(clef,q); if(opts.length<4 && !seen.has(l)){seen.add(l);opts.push({p:q,ok:false})}
  }
  return {mode:"note",sub:"find",n,options:shuffle(opts).map(o=>({...o,label:noteLetter(clef,o.p)}))};
}
const noteFacts = n => `To <b>${n.letter}</b> (${SOLF[n.letter]}) · ${CLEFS[n.clef].name} · leży ${placeText(n.p)}`;

/* ---------- questions ---------- */
function distractors(correct, n, key){
  const p = pool().filter(c=>c.code!==correct.code && key(c)!==key(correct));
  const same = shuffle(p.filter(c=>c.cont===correct.cont)), other = shuffle(p.filter(c=>c.cont!==correct.cont));
  const out=[], seen=new Set([key(correct)]);
  for(const c of [...same.slice(0,2),...other,...same.slice(2)]){ if(out.length>=n)break; if(!seen.has(key(c))){seen.add(key(c));out.push(c)} }
  return out;
}
function makeQuestion(c, mode){
  if(mode==="flag"||mode==="name"){
    const opts = shuffle([c,...distractors(c,3,x=>x.name)]);
    return {c,mode,options:opts.map(o=>({label:o.name,code:o.code,ok:o.code===c.code}))};
  }
  if(mode==="capital"){
    const opts = shuffle([c,...distractors(c,3,x=>x.capital)]);
    return {c,mode,options:opts.map(o=>({label:o.capital,ok:o.code===c.code}))};
  }
  const right = pick(c.langs);
  const others = shuffle([...new Set(pool().flatMap(x=>x.langs))].filter(l=>!c.langs.includes(l)));
  let wrong = others.slice(0,3);
  if(wrong.length<3) wrong = shuffle([...new Set(ALL.flatMap(x=>x.langs))].filter(l=>!c.langs.includes(l))).slice(0,3);
  return {c,mode,options:shuffle([{label:right,ok:true},...wrong.map(l=>({label:l,ok:false}))])};
}
function questionText(q){
  if(q.mode==="note") return q.sub==="name" ? `Jaka to nuta? ${CLEFS[q.n.clef].name}.` : `Znajdź nutę ${q.n.letter}, ${SOLF[q.n.letter]}. ${CLEFS[q.n.clef].name}.`;
  return {flag:"Z jakiego kraju jest ta flaga?", name:`Która flaga należy do kraju ${q.c.name}?`,
    capital:`Jaka jest stolica kraju ${q.c.name}?`, lang:`Jakim językiem mówi się w kraju ${q.c.name}?`}[q.mode];
}
function shortQ(q){if(q.mode==="note")return q.sub==="name"?"Jaka to nuta?":"Gdzie jest ta nuta?";return {flag:"Z jakiego kraju jest ta flaga?",name:"Która to flaga?",capital:"Jaka jest stolica?",lang:"Który język jest tu urzędowy?"}[q.mode]}

/* ---------- screens ---------- */
function render(){
  const h = {home,game,end,atlas}[S.screen]();
  app.innerHTML = header()+h;
  bind();
}
function header(){
  return `<div class="top"><div class="brand"><div class="pole" aria-hidden="true"></div><h1>Flagi <span>Świata</span></h1></div>
  <div class="row" style="justify-content:flex-end">${S.screen!=="home"?`<button class="ghost" data-act="home">Menu</button>`:""}
  <div class="stars" title="Wszystkie zebrane gwiazdki">${STAR("on").replace('<svg','<svg width="20" height="20" style="fill:currentColor"')} ${S.stars}</div></div></div>`;
}
function home(){
  const ex = ALL.find(c=>c.code==="it"), ex2=ALL.find(c=>c.code==="jp");
  const pics = {
    flag:`${img(ex)}<span class="arrow">→</span><span class="word">Włochy</span>`,
    name:`<span class="word">Japonia</span><span class="arrow">→</span>${img(ex2)}`,
    capital:`<span class="word">Francja</span><span class="arrow">→</span><span class="word">Paryż</span>`,
    lang:`<span class="word">Brazylia</span><span class="arrow">→</span><span class="word">portugalski</span>`,
    note:`${staffSVG("treble",2)}<span class="arrow">→</span><span class="word">G</span>`,
    mix:`${img(ALL.find(c=>c.code==="pl"))}<span class="arrow">+</span>${staffSVG("bass",4)}`
  };
  const n = pool().length;
  return `<p class="hello">Wybierz zabawę. Każda runda to ${ROUND} pytań, a za dobrą odpowiedź dostajesz gwiazdkę.</p>
  <div class="lvl" role="group" aria-label="Poziom"><span class="lab">Poziom</span>
    <button class="seg" data-level="easy" aria-pressed="${S.level==="easy"}">Łatwy · ${ALL.filter(c=>c.easy).length} krajów</button>
    <button class="seg" data-level="all" aria-pressed="${S.level==="all"}">Cały świat · ${ALL.length} krajów</button></div>
  <div class="modes">${Object.entries(MODES).map(([k,m])=>{const b=S.best[k+":"+S.level];
    return `<button class="mode" data-mode="${k}"><div class="pic">${pics[k]}</div><h3>${m.title}</h3><p>${m.desc}</p>
    <span class="best">${b!=null?`Najlepszy wynik: ${b}/${ROUND}`:"Jeszcze nie grane"}</span></button>`}).join("")}</div>
  <button class="ghost atlasbtn" data-act="atlas">Zobacz wszystkie flagi (atlas)</button>`;
}
function game(){
  const G=S.game, q=G.qs[G.i];
  const dots = G.qs.map((_,i)=>`<span class="dot ${i<G.i||(i===G.i&&G.answered)?(G.res[i]?"ok":"no"):i===G.i?"now":""}"></span>`).join("");
  let prompt="";
  if(q.mode==="note") prompt = q.sub==="name" ? staffSVG(q.n.clef,q.n.p,"big")
    : `<div class="notename">${q.n.letter}<small>${SOLF[q.n.letter]} · ${CLEFS[q.n.clef].name}</small></div>`;
  else if(q.mode==="flag") prompt = img(q.c,"bigflag");
  else if(q.mode==="name") prompt = `<div class="country">${esc(q.c.name)}</div>`;
  else prompt = `${img(q.c,"bigflag")}<div class="country" style="font-size:clamp(24px,6vw,36px)">${esc(q.c.name)}</div>`;
  const opts = q.options.map((o,i)=>{
    const find = q.mode==="note"&&q.sub==="find";
    let cls="ans"+(q.mode==="name"?" flagans":"")+(find?" staffans":"");
    if(G.answered){ if(o.ok)cls+=" right"; else if(i===G.choice)cls+=" wrong"; else cls+=" dim"; }
    const inner = find ? staffSVG(q.n.clef,o.p)
      : q.mode==="note" ? `<span>${o.label}<span class="sol">${SOLF[o.label]}</span></span>`
      : q.mode==="name" ? `<img src="${flag(o.code)}" alt="${G.answered?"Flaga: "+esc(o.label):"Flaga numer "+(i+1)}">` : esc(o.label);
    return `<button class="${cls}" data-ans="${i}" ${G.answered?"disabled":""}>${inner}</button>`;
  }).join("");
  let fb="";
  if(G.answered){
    const ok=G.res[G.i], last=G.i===G.qs.length-1;
    const praise = pick(["Brawo!","Super!","Świetnie!","Tak jest!","Ekstra!"]);
    fb = `<div class="fb ${ok?"good":"bad"}" role="status"><span class="big">${ok?praise:"Prawie!"}</span>
      ${q.mode==="note"?staffSVG(q.n.clef,q.n.p):img(q.c)}<div class="facts">${q.mode==="note"?noteFacts(q.n):facts(q.c)}</div>
      <button class="next" data-act="next" id="next">${last?"Wynik":"Dalej"}</button></div>`;
  }
  return `<div class="bar"><div class="dots">${dots}</div><span class="streak">${G.streak>=2?"🔥 "+G.streak:""}</span></div>
  <div class="card${G.answered?"":" fresh"}"><div class="q"><span>${shortQ(q)}</span>
    <button class="say" data-act="say" aria-label="Przeczytaj pytanie">${SPEAK}</button></div>
    ${prompt}<div class="answers">${opts}</div>${fb}</div>`;
}
function end(){
  const G=S.game, sc=G.res.filter(Boolean).length, st = sc>=9?3:sc>=6?2:sc>=3?1:0;
  const msg = ["Spróbuj jeszcze raz, dasz radę!","Dobry początek!","Bardzo dobrze!",G.mode==="note"?"Mistrz nut!":G.mode==="mix"?"Mistrz!":"Mistrz flag!"][st];
  const miss = G.qs.filter((_,i)=>!G.res[i]);
  return `<div class="card end"><div class="trophy">${[0,1,2].map(i=>STAR(i<st?"on":"off").replace('class="on"',`class="on" style="animation-delay:${i*.2}s"`)).join("")}</div>
    <h2>${msg}</h2><div class="score">${sc}/${ROUND}</div>
    <p style="margin:0;color:var(--muted)">${MODES[G.mode].title} · ${S.level==="easy"?"poziom łatwy":"cały świat"}</p>
    ${miss.length?`<h3 style="font-size:18px">Do powtórki</h3><div class="missed">${miss.map(q=>q.mode==="note"?`<figure>${staffSVG(q.n.clef,q.n.p)}<figcaption>${q.n.letter} (${SOLF[q.n.letter]})</figcaption></figure>`:`<figure>${img(q.c)}<figcaption>${esc(q.c.name)}${q.mode==="capital"?"<br>"+esc(q.c.capital):q.mode==="lang"?"<br>"+esc(q.c.langs.join(", ")):""}</figcaption></figure>`).join("")}</div>`:""}
    <div class="row"><button class="next" data-mode="${G.mode}">Jeszcze raz</button><button class="ghost" data-act="home">Inna zabawa</button></div></div>`;
}
const CONTS = ["Wszystkie","Europa","Azja","Afryka","Ameryka Północna","Ameryka Południowa","Australia i Oceania"];
function atlas(){
  const f=S.cont||"Wszystkie", list = ALL.filter(c=>f==="Wszystkie"||c.cont===f).sort((a,b)=>a.name.localeCompare(b.name,"pl"));
  return `<h2>Atlas flag</h2><div class="filters">${CONTS.map(c=>`<button class="seg" data-cont="${c}" aria-pressed="${c===f}">${c}</button>`).join("")}</div>
  <div class="grid">${list.map(c=>`<button class="tile" data-read="${c.code}">${img(c)}<b>${esc(c.name)}</b><small>Stolica: ${esc(c.capital)}<br>${esc(langText(c))}</small></button>`).join("")}</div>`;
}

/* ---------- actions ---------- */
function start(mode){
  const used=new Set(), countries=shuffle(pool());
  const qs = Array.from({length:ROUND},(_,i)=>{
    const m = mode==="mix" ? pick(["flag","name","capital","lang","note","note"]) : mode;
    return m==="note" ? makeNoteQuestion(used) : makeQuestion(countries[i],m);
  });
  S.game={mode,qs,i:0,res:[],answered:false,choice:null,streak:0};
  S.screen="game"; render(); window.scrollTo(0,0);
}
function answer(i){
  const G=S.game; if(G.answered)return; const q=G.qs[G.i], ok=q.options[i].ok;
  G.answered=true; G.choice=i; G.res[G.i]=ok; G.streak = ok?G.streak+1:0;
  if(ok){S.stars++; store.set("stars",S.stars); burst(14)}
  render();
  if(q.mode==="note"){ playNote(noteFreq(q.n.clef,q.n.p)); setTimeout(()=>say((ok?"Brawo! ":"Prawie! ")+`To ${q.n.letter}, ${SOLF[q.n.letter]}.`),700); }
  else { const c=q.c; say((ok?"Brawo! ":"Prawie! ")+ (q.mode==="capital"?`Stolica kraju ${c.name} to ${c.capital}.`: q.mode==="lang"?`W kraju ${c.name} urzędowy jest ${c.langs.join(", ")}.`:`To ${c.name}.`)); }
  document.getElementById("next")?.focus({preventScroll:true});
}
function next(){
  const G=S.game;
  if(G.i<G.qs.length-1){G.i++;G.answered=false;G.choice=null;render();return}
  const sc=G.res.filter(Boolean).length, k=G.mode+":"+S.level;
  if(S.best[k]==null||sc>S.best[k]){S.best[k]=sc;store.set("best",S.best)}
  S.screen="end"; render(); window.scrollTo(0,0); if(sc>=6)burst(80);
}
function bind(){
  app.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>start(b.dataset.mode));
  app.querySelectorAll("[data-level]").forEach(b=>b.onclick=()=>{S.level=b.dataset.level;store.set("level",S.level);render()});
  app.querySelectorAll("[data-ans]").forEach(b=>b.onclick=()=>answer(+b.dataset.ans));
  app.querySelectorAll("[data-cont]").forEach(b=>b.onclick=()=>{S.cont=b.dataset.cont;render()});
  app.querySelectorAll("[data-read]").forEach(b=>b.onclick=()=>{const c=ALL.find(x=>x.code===b.dataset.read);say(`${c.name}. Stolica: ${c.capital}. ${langText(c)}.`)});
  app.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>{
    const a=b.dataset.act;
    if(a==="home"){S.screen="home";render()} else if(a==="atlas"){S.screen="atlas";render()}
    else if(a==="next")next(); else if(a==="say"){const q=S.game.qs[S.game.i];say(questionText(q))}
  });
}
document.addEventListener("keydown",e=>{
  if(S.screen!=="game")return; const G=S.game;
  if(!G.answered&&["1","2","3","4"].includes(e.key))answer(+e.key-1);
  else if(G.answered&&(e.key==="Enter"||e.key===" ")&&document.activeElement?.id!=="next"){e.preventDefault();next()}
});

/* ---------- confetti ---------- */
const cv=document.getElementById("fx"), cx=cv.getContext("2d"); let parts=[], raf=0;
function burst(n){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  cv.width=innerWidth*devicePixelRatio; cv.height=innerHeight*devicePixelRatio;
  const cols=["#FFC83D","#1F6FB8","#D9432F","#1E9E5A","#FFFFFF"];
  for(let i=0;i<n;i++)parts.push({x:innerWidth/2+(Math.random()-.5)*120,y:innerHeight*.45,vx:(Math.random()-.5)*12,vy:-Math.random()*12-4,r:Math.random()*Math.PI,s:6+Math.random()*6,c:pick(cols),l:90});
  if(!raf)raf=requestAnimationFrame(tick);
}
function tick(){
  const d=devicePixelRatio; cx.clearRect(0,0,cv.width,cv.height);
  parts=parts.filter(p=>p.l-->0&&p.y<innerHeight+20);
  for(const p of parts){p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=.2;cx.save();cx.translate(p.x*d,p.y*d);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s*d/2,-p.s*d/3,p.s*d,p.s*d*.66);cx.restore()}
  raf = parts.length?requestAnimationFrame(tick):0; if(!raf)cx.clearRect(0,0,cv.width,cv.height);
}
render();

if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
</script>
